<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset=".45" stop-color="#111827"/><stop offset="1" stop-color="#1e0738"/></linearGradient>
  <linearGradient id="neon" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".32"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1200" height="360" rx="30" fill="url(#bg)"/>
<circle cx="980" cy="90" r="210" fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="r" values="180;230;180" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="170" cy="320" r="150" fill="#22d3ee" opacity=".10" filter="url(#blur)">
  <animate attributeName="cx" values="170;240;170" dur="7s" repeatCount="indefinite"/>
</circle>
<g opacity=".18" stroke="#94a3b8" stroke-width="1">
  <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200"/>
  <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360"/>
</g>
<path d="M-50 300 C180 170 330 360 540 235 S900 120 1250 235" fill="none" stroke="url(#neon)" stroke-width="3" opacity=".7">
  <animate attributeName="d" values="M-50 300 C180 170 330 360 540 235 S900 120 1250 235;M-50 270 C180 210 330 320 540 255 S900 90 1250 210;M-50 300 C180 170 330 360 540 235 S900 120 1250 235" dur="8s" repeatCount="indefinite"/>
</path>
<path d="M0 320 C220 210 380 350 600 270 S930 150 1200 250" fill="none" stroke="#22d3ee" stroke-width="1" opacity=".4"/>
<g fill="#fff">
  <circle cx="1030" cy="70" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1090" cy="130" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="940" cy="150" r="1.5"><animate attributeName="opacity" values=".1;1;.1" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="1130" cy="55" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
</g>
<text x="70" y="115" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">A.R. Joshua Jeberson</text>
<rect x="72" y="140" width="290" height="5" rx="3" fill="url(#neon)">
  <animate attributeName="width" values="80;290;160;290" dur="4s" repeatCount="indefinite"/>
</rect>
<text x="70" y="195" fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif" font-size="25">AI &amp; Data Science • Python • ML • Deep Learning</text>
<text x="70" y="235" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="18">Building practical AI systems, one project at a time.</text>
<g font-family="monospace" font-weight="700" font-size="26">
 <text x="1020" y="270" fill="#22d3ee">&lt;</text><text x="1050" y="270" fill="#8b5cf6">/</text><text x="1075" y="270" fill="#ec4899">&gt;</text>
</g>
<text x="1045" y="305" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="12">AI • CODE • CREATE</text>
</svg>